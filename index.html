<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LevinLevin — The Museum</title>
  <meta name="description" content="The art LevinLevin collects, on Tezos, Ethereum and Solana.">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">

  <meta property="og:type" content="website">
  <meta property="og:title" content="LevinLevin — The Museum">
  <meta property="og:description" content="The art I collect, on Tezos, Ethereum and Solana.">
  <meta property="og:image" content="https://museum.levinlevin.xyz/og.jpg">
  <meta property="og:url" content="https://museum.levinlevin.xyz/">
  <link rel="canonical" href="https://museum.levinlevin.xyz/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@levinlevin__">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/hedvig-letters-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <a class="wordmark" href="#/"><img class="mark-pfp" src="pfp@4x.png" width="48" height="48" alt=""><span data-name>LevinLevin</span></a>
    <nav>
      <a href="#/artist-of-the-week" data-week-nav hidden>Artist of the Week</a>
      <a href="#about" data-about-link>About</a>
    </nav>
  </header>

  <main>
    <!-- ── The Museum: the whole collection on one page ── -->
    <div data-page="museum">
      <section class="hero">
        <div class="hero-specimen" aria-hidden="true"></div>
        <h1 class="hero-title"><span class="ink">The Museum.</span></h1>
        <div class="hero-foot">
          <span data-updated></span>
          <a data-x href="#" target="_blank" rel="noopener">@ ↗</a>
        </div>
      </section>

      <!-- every work, in the order of curation.json → museum, then newest first -->
      <section class="wall" data-wall aria-label="The collection"></section>
      <a class="further-link" href="#/further" data-further-link hidden>Further works <span class="arrow">→</span></a>

      <!-- Artist of the Week, hidden until the first pick -->
      <section class="block" id="week" data-week hidden>
        <div class="block-head">
          <h2>Artist of the Week</h2>
          <span class="quiet" data-week-sub></span>
        </div>
        <article class="pick" data-pick></article>
        <div class="week-past" data-week-past-block>
          <div class="posts-head">
            <span data-week-past-title>Earlier picks</span>
            <span data-week-count></span>
          </div>
          <div class="grid" data-week-past></div>
        </div>
      </section>
    </div>

    <!-- ── Further works: off the main wall, linked from its end ── -->
    <div data-page="further" hidden>
      <section class="page-head">
        <h1 class="page-title">Further works</h1>
        <p class="page-sub"><a class="quiet" href="#/">← The Museum</a></p>
      </section>
      <section class="wall" data-wall-further aria-label="Further works"></section>
    </div>

    <!-- ── The Watch List (private, not linked) ───── -->
    <div data-page="watchlist" hidden>
      <section class="page-head">
        <h1 class="page-title">Watch List</h1>
        <p class="page-sub" data-watch-sub>Private.</p>
      </section>
      <section class="block block-tight">
        <form class="lock" data-lock autocomplete="on">
          <input type="text" name="username" value="watchlist" autocomplete="username" hidden>
          <label class="lock-field">
            <span class="quiet">Password</span>
            <input type="password" name="password" autocomplete="current-password" required data-lock-input>
          </label>
          <label class="lock-remember quiet"><input type="checkbox" data-lock-remember> Remember on this device</label>
          <button type="submit" class="lock-go">Open →</button>
          <p class="lock-error" data-lock-error hidden>That isn't it.</p>
        </form>
        <div class="grid watch" data-watch-grid hidden></div>
        <p class="lock-foot quiet" data-watch-foot hidden></p>
      </section>
    </div>

    <!-- ── shared ─────────────────────────────────── -->
    <section class="block" id="about">
      <div class="block-head">
        <h2>About</h2>
      </div>
      <div class="about">
        <div class="about-who">
          <img class="about-pfp" src="pfp@4x.png" width="48" height="48" alt="LevinLevin's punk">
          <p class="about-bio" data-bio></p>
          <p class="about-statement" data-statement></p>
        </div>
        <dl class="wallets" data-wallets></dl>
      </div>
      <div class="posts" data-posts hidden>
        <div class="posts-head">
          <span>On X</span>
          <a class="quiet" data-x href="#" target="_blank" rel="noopener">@ ↗</a>
        </div>
        <div class="posts-list" data-posts-list></div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span class="foot-mark" data-name>LevinLevin</span>
    <div class="foot-row">
      <span data-updated></span>
      <a data-x href="#" target="_blank" rel="noopener">X ↗</a>
      <a href="#" data-top>Back to top ↑</a>
    </div>
  </footer>

  <div class="sheet" data-sheet hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-bar">
      <span class="quiet" data-sheet-count></span>
      <div class="sheet-nav">
        <div class="seg" role="group" aria-label="Browse">
          <button type="button" data-prev aria-label="Previous work">←</button>
          <button type="button" data-next aria-label="Next work">→</button>
        </div>
        <button type="button" class="pill" data-close>Close</button>
      </div>
    </div>
    <div class="sheet-body">
      <figure class="sheet-media" data-sheet-media></figure>
      <aside class="sheet-info" data-sheet-info></aside>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
